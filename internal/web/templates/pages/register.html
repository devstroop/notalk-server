{{define "content"}}
<div class="bg-white rounded-2xl border border-gray-200 p-6 sm:p-8 shadow-sm">
  <form method="POST" action="/register" hx-boost="false">
    <h2 class="text-xl font-bold text-gray-900 mb-1">Create an account</h2>
    <p class="text-sm text-gray-500 mb-6">Get started with NoTalk for free.</p>
    <div class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
        <input type="text" id="username" name="username" required autofocus
               class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
               placeholder="Choose a username">
      </div>
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">Email</label>
        <input type="email" id="email" name="email"
               class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
               placeholder="you@example.com">
      </div>
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">Password</label>
        <input type="password" id="password" name="password" required minlength="8"
               class="w-full px-3.5 py-2.5 border border-gray-300 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none"
               placeholder="Min 8 characters">
      </div>
    </div>
    <button type="submit"
            class="btn-loading w-full mt-6 px-4 py-2.5 bg-brand-600 text-white text-sm font-semibold rounded-xl hover:bg-brand-700 transition-all flex items-center justify-center gap-2">
      <svg class="btn-spinner hidden w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
      Create account
    </button>
    <p class="mt-5 text-center text-sm text-gray-500">Already have an account? <a href="/login" class="text-brand-600 hover:text-brand-700 font-medium">Sign in</a></p>
  </form>
</div>
{{end}}
