      <div class="w-9 h-9 rounded-lg bg-[#059669] text-white flex items-center justify-center transition-transform group-hover:scale-105">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52s.198-.298.298-.497c.099-.198.05-.371-.025-.52s-.669-1.612-.916-2.207c-.242-.579-.487-.5-.669-.51a13 13 0 0 0-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074s2.096 3.2 5.077 4.487c.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413s.248-1.289.173-1.413c-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.82 9.82 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.82 11.82 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.9 11.9 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.82 11.82 0 0 0-3.48-8.413"/></svg>
      </div>
      <span class="text-lg font-bold text-gray-900">NoTalk</span>
    </a>
    <!-- Desktop nav -->
    <div class="hidden sm:flex items-center gap-1">
      <a href="/about" class="px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg hover:bg-gray-100/60 transition-colors">About</a>
      <a href="/pricing" class="px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg hover:bg-gray-100/60 transition-colors">Pricing</a>
      <div class="w-px h-6 bg-gray-200 mx-2"></div>
      <a href="/login" class="px-3 py-2 text-sm font-medium text-gray-600 hover:text-gray-900 rounded-lg hover:bg-gray-100/60 transition-colors">Sign in</a>
      {{if .Data.RegistrationEnabled}}
      <a href="/register" class="ml-1 px-4 py-2 text-sm font-medium rounded-lg bg-brand-600 text-white hover:bg-brand-700 transition-colors shadow-sm">Get started</a>
      {{end}}
    </div>
    <!-- Mobile hamburger -->
    <div class="sm:hidden" x-data="{ mobileMenu: false }">
      <button @click="mobileMenu = !mobileMenu" class="p-2 rounded-lg text-gray-500 hover:bg-gray-100 transition-colors">
        <svg x-show="!mobileMenu" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
        <svg x-show="mobileMenu" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12"/></svg>
      </button>
      <div x-show="mobileMenu" x-cloak @click.away="mobileMenu = false"
           x-transition:enter="transition ease-out duration-150"
           x-transition:enter-start="opacity-0 -translate-y-1"
           x-transition:enter-end="opacity-100 translate-y-0"
           x-transition:leave="transition ease-in duration-100"
           x-transition:leave-start="opacity-100 translate-y-0"
           x-transition:leave-end="opacity-0 -translate-y-1"
           class="absolute top-full right-4 mt-1 w-48 bg-white border border-gray-200 rounded-xl shadow-lg py-2 z-50">
        <a href="/about" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">About</a>
        <a href="/pricing" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Pricing</a>
        <div class="border-t border-gray-100 my-1"></div>
        <a href="/login" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-50">Sign in</a>
        {{if .Data.RegistrationEnabled}}
        <a href="/register" class="block px-4 py-2 text-sm font-medium text-brand-600 hover:bg-brand-50">Get started</a>
        {{end}}
      </div>
    </div>
  </div>
</nav>
<!-- Spacer for fixed navbar -->
<div class="h-16"></div>
{{end}}
