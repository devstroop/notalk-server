services:
  redis:
    image: redis:7-alpine
    container_name: notalk-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${NOTALK_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    # Opt-in: enabled via NOTALK_REDIS_ENABLED=true, but container can stay idle when disabled.

  postgres:
    image: postgres:18-alpine
    container_name: notalk-postgres
    restart: unless-stopped
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB"]
    environment:
      POSTGRES_USER: notalk
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
      POSTGRES_DB: notalk
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notalk -d notalk"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 15s

  notalk:
    build: .
    container_name: notalk
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${NOTALK_SERVER_PORT:-5000}:${NOTALK_SERVER_PORT:-5000}"
    volumes:
      - notalk-data:/data
    environment:
      TZ: UTC
      NOTALK_SERVER_HOST: "0.0.0.0"
      NOTALK_SERVER_PORT: "${NOTALK_SERVER_PORT:-5000}"
      NOTALK_AUTH_SECRET_KEY: "${NOTALK_AUTH_SECRET_KEY:-changeme}"
      NOTALK_LOG_LEVEL: "${NOTALK_LOG_LEVEL:-info}"
      NOTALK_DATABASE_DSN: "postgres://notalk:${POSTGRES_PASSWORD:-postgres}@postgres:5432/notalk?sslmode=disable"
      NOTALK_ACCOUNTS_DIR: "/data/accounts"
      NOTALK_CORS_ORIGINS: "${NOTALK_CORS_ORIGINS:-*}"
      NOTALK_AUTH_REGISTRATION_ENABLED: "${NOTALK_AUTH_REGISTRATION_ENABLED:-true}"
      NOTALK_SWAGGER_ENABLED: "${NOTALK_SWAGGER_ENABLED:-true}"
      NOTALK_REDIS_ENABLED: "${NOTALK_REDIS_ENABLED:-false}"
      NOTALK_REDIS_ADDR: "${NOTALK_REDIS_ADDR:-redis:6379}"
      NOTALK_REDIS_PASSWORD: "${NOTALK_REDIS_PASSWORD:-}"
      NOTALK_REDIS_DB: "${NOTALK_REDIS_DB:-0}"

volumes:
  pg-data:
  notalk-data:
