[server]
host = "0.0.0.0"
port = 3000

[auth]
secret_key = "change-this-secret-key-in-production"
registration_enabled = false  # Set to true to allow public user registration

[smtp]
# host = "smtp.example.com"  # Required for forgot-password emails
# port = 587
# username = ""
# password = ""
# from = "NoTalk <noreply@example.com>"
# tls = false       # Use implicit TLS (port 465)
# starttls = true   # Use STARTTLS (port 587)

[logging]
level = "info"

[llm]
# enabled = true
# provider = "openai"       # "openai" or "ollama"
# api_key = "sk-..."       # required for OpenAI; leave blank for Ollama  (use NOTALK_LLM_API_KEY env var in production)
# base_url = ""            # override API endpoint; blank = provider default
# model = "gpt-4o-mini"   # default model used by Copilot and Autopilot

[database]
# dsn = "postgres://localhost:5432/notalk?sslmode=disable"  # PostgreSQL connection string

[cors]
allow_origins = ["*"]
allow_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allow_headers = ["authorization", "content-type"]

[limits]
max_concurrent_requests = 50
request_timeout_ms = 30000
max_upload_size = 10485760  # 10MB

[accounts]
# base_directory = ""  # Default: ~/.notalk/accounts

[accounts.defaults]
idle_timeout = 300  # seconds (0 = never auto-disconnect)

[webhooks]
enabled = false
timeout_ms = 5000
retry_count = 3
retry_delay_ms = 1000

[swagger]
enabled = true
path = "/api-docs"

[mcp]
enabled = true       # Enable/disable MCP server (can also toggle at runtime via admin UI)

[billing]
enabled = false                        # Set to true to enable plan-based billing
# stripe_secret_key = "sk_..."         # Stripe secret key (for paid plans)
# stripe_webhook_secret = "whsec_..." # Stripe webhook signing secret
default_plan = "free"                  # Plan assigned to new users
